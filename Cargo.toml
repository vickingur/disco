[package]
name = "disco"
version = "0.1.0"
edition = "2024"
description = "Disk-space analyzer that finds and reclaims developer build artifacts"

# The installed command is `disko` — `disco` collides with Mono's discovery tool.
[[bin]]
name = "disko"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29.0"
ratatui = "0.30.2"
rayon = "1.12.0"
trash = "5.2.6"

[profile.release]
opt-level = 3
