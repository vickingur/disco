[package]
name = "disco"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Disk-space analyzer that finds and reclaims developer build artifacts"
license = "MIT"
repository = "https://github.com/vickingur/disco"
readme = "README.md"
keywords = ["disk-usage", "cleanup", "tui", "node_modules", "build-artifacts"]
categories = ["command-line-utilities", "filesystem"]

# The installed command is `disko` — `disco` collides with Mono's discovery tool.
[[bin]]
name = "disko"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29.0"
ratatui = "0.30.2"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
trash = "5.2.6"

[profile.release]
opt-level = 3
